{{- if .Values.lavalink.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quackmuzik.fullname" . }}-lavalink-config
  labels:
    {{- include "quackmuzik.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: {{ .Values.lavalink.server.port }}
      address: 0.0.0.0

    lavalink:
      plugins:
        - dependency: 'dev.lavalink.youtube:youtube-plugin:1.15.0'
          repository: 'https://maven.lavalink.dev/releases'
          snapshot: false
        - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.1'
          repository: 'https://maven.topi.wtf/releases'
          snapshot: false
      server:
        password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
        sources:
          youtube: false
          bandcamp: true
          soundcloud: true
          twitch: true
          vimeo: true
          http: true
          local: false
        bufferDurationMs: 400
        frameBufferDurationMs: 5000
        youtubePlaylistLoadLimit: 6
        playerUpdateInterval: 5
        youtubeSearchEnabled: false
        soundcloudSearchEnabled: true
        gc-warnings: true

    metrics:
      prometheus:
        enabled: false
        endpoint: /metrics

    sentry:
      dsn: '${SENTRY_DSN:}'
      environment: '${SENTRY_ENVIRONMENT:}'

    logging:
      file:
        path: ./logs/

      level:
        root: INFO
        lavalink: INFO

      logback:
        rollingpolicy:
          max-file-size: 1GB
          max-history: 30

    plugins:
      youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        remoteCipher:
          url: 'http://{{ include "quackmuzik.fullname" . }}-yt-cipher:{{ .Values.ytCipher.service.port }}/'
          userAgent: 'QuackMuzik-Bot'
        clients:
          - MUSIC
          - ANDROID_VR
          - WEB
          - WEBEMBEDDED
        oauth:
          enabled: true
          refreshToken: '${YOUTUBE_OAUTH_REFRESH_TOKEN:}'
          skipInitialization: true

      lavasrc:
        spotify:
          enabled: true
          clientId: '${SPOTIFY_CLIENT_ID:}'
          clientSecret: '${SPOTIFY_CLIENT_SECRET:}'
          countryCode: 'US'
          playlistLoadLimit: 6
          albumLoadLimit: 6
          localFiles: false

        applemusic:
          enabled: false
          countryCode: 'US'
          mediaAPIToken: '${APPLE_MUSIC_API_TOKEN:}'
          playlistLoadLimit: 6
          albumLoadLimit: 6

        deezer:
          enabled: false
          masterDecryptionKey: '${DEEZER_MASTER_KEY:}'

        yandexmusic:
          enabled: false
          accessToken: '${YANDEX_MUSIC_TOKEN:}'
          playlistLoadLimit: 1

        floweryTts:
          enabled: true
          voice: '3edfe2d3-45fb-5f89-9689-7b79d77b65d7'
          translate: false
          silence: 0
          speed: 1.0
          audioFormat: 'mp3'

        vkmusic:
          enabled: false
          userToken: '${VK_USER_TOKEN:}'
          playlistLoadLimit: 6
          recommendationsLoadLimit: 3

        tidal:
          enabled: false
          countryCode: 'US'
          tidalToken: '${TIDAL_TOKEN:}'
          tidalRefreshToken: '${TIDAL_REFRESH_TOKEN:}'

        qobuz:
          enabled: false
          userOauthToken: '${QOBUZ_OAUTH_TOKEN:}'
          appId: '${QOBUZ_APP_ID:}'

        jiosaavn:
          enabled: false

        providers:
          - 'ytsearch:"%ISRC%"'
          - 'ytsearch:%QUERY%'

        sources:
          spotify: true
          applemusic: false
          deezer: false
          yandexmusic: false
          floweryTts: true
          vkmusic: false
          tidal: false
          qobuz: false
          jiosaavn: false
{{- end }}

