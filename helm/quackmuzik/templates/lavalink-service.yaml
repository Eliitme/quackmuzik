{{- if .Values.lavalink.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quackmuzik.fullname" . }}-lavalink
  labels:
    {{- include "quackmuzik.labels" . | nindent 4 }}
    app.kubernetes.io/component: lavalink
spec:
  type: {{ .Values.lavalink.service.type }}
  ports:
    - port: {{ .Values.lavalink.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "quackmuzik.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lavalink
{{- end }}

