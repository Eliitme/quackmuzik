{{- if .Values.ytCipher.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quackmuzik.fullname" . }}-yt-cipher
  labels:
    {{- include "quackmuzik.labels" . | nindent 4 }}
    app.kubernetes.io/component: yt-cipher
spec:
  type: {{ .Values.ytCipher.service.type }}
  ports:
    - port: {{ .Values.ytCipher.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "quackmuzik.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: yt-cipher
{{- end }}

